name: Sync for

on:
  schedule:
    - cron: '0 0 * * *' # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "ytmdesktop/ytmdesktop"
          source_branch: "development"
          destination_branch: "development"
          github_token: ${{ secrets.GITHUB_TOKEN }}